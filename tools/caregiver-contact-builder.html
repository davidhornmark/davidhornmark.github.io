<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caregiver Contact Builder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz@17..18&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body {
      font-family: 'Google Sans', sans-serif !important;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-dark border-bottom border-body navbar-expand-lg mb-4" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand mb-0 h1" href="../index.html">dh-tools</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Caregiver Contact Builder</a></li>
          <li class="nav-item"><span class="nav-link">Upcoming Feature...</span></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-4">
    <h1>Caregiver Contact Builder</h1>
  </div>

  <div class="container p-0 mb-3">
    <table id="vcardTable" class="table table-striped rounded border border-secondary">
      <thead>
        <tr>
          <th scope="col">Name of Child</th>
          <th scope="col">Name of Caregiver</th>
          <th scope="col">Role of Caregiver</th>
          <th scope="col">Phone Number</th>
          <th scope="col" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" class="form-control w-100 bg-transparent border-0 p-1" name="childName" /></td>
          <td><input type="text" class="form-control w-100 bg-transparent border-0 p-1" name="caregiverName" /></td>
          <td>
            <select id="caregiverRole" class="form-select bg-transparent border-0" name="caregiverRole">
              <option value="Mother">Mother</option>
              <option value="Father">Father</option>
              <option value="Guardian">Guardian</option>
            </select>
          </td>
          <td><input type="text" class="form-control w-100 bg-transparent border-0 p-1" name="phoneNumber" /></td>
          <td class="text-center">
            <button type="button" class="btn btn-outline-primary me-1" onclick="duplicateRow(this)"><i
                class="bi bi-copy"></i></button>
            <button type="button" class="btn btn-outline-danger" onclick="deleteRow(this)"><i
                class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="container text-center">
    <div class="row">
      <div class="col">
        <div class="row mb-2">
          <div class="col p-0 pe-2">
            <button type="button" class="w-100 btn btn-outline-dark" onclick="addRow()"><i
                class="bi bi-plus-circle"></i> Add new entry</button>
          </div>
          <div class="col p-0">
            <button type="button" class="w-100 btn btn-outline-dark" onclick="generateVCard()"><i
                class="bi bi-play-circle"></i> Generate</button>
          </div>
        </div>
        <div class="row">
          <button type="button" class="w-100 btn btn-dark" onclick="downloadVCard()"><i class="bi bi-download"></i>
            Download .vcf</button>
        </div>
      </div>
      <div class="col p-0 ms-3">
        <textarea id="resultArea" rows="3" class="form-control w-100" placeholder="Preview of results.."
          readonly></textarea>
      </div>
    </div>
  </div>

  <div class="container text-center p-0 mt-5">
    <hr />
    <p class="text-body-secondary">Created by David Hörnmark - @davidhornmark</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/caregiver-contact-builder.js"></script>
</body>

</html>
